<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>合成大苗哥·雷霆版 (慎点!!!)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* 适配移动端动态地址栏 */
            overflow: hidden;
            background-color: #0F1015;
            background-image: radial-gradient(#252A34 10%, transparent 11%);
            background-size: 20px 20px;
            color: #E5E9F0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部看板自适应 */
        .top-bar {
            width: 100%;
            max-width: 480px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181A20;
            border-bottom: 2px solid #D4AF37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
            flex-shrink: 0;
        }

        .title-group h1 {
            font-size: 17px;
            color: #D4AF37;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            white-space: nowrap;
        }
        .subtitle {
            font-size: 11px;
            color: #FF334B;
            font-weight: 900;
            letter-spacing: 1px;
            animation: warningBlink 1.2s infinite alternate;
        }
        @keyframes warningBlink {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 8px #FF334B; }
        }

        .score-board {
            text-align: right;
        }
        .score-label {
            font-size: 10px;
            color: #8D99AE;
        }
        .score-val {
            font-size: 20px;
            font-weight: 800;
            color: #FFD166;
            font-family: 'Arial Black', sans-serif;
        }

        /* 手机端全贴合战斗舞台 */
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            flex: 1;
            margin: 0 auto;
            overflow: hidden;
            background: linear-gradient(180deg, #12141A 0%, #090A0D 100%);
            border-left: 2px solid #2B2D42;
            border-right: 2px solid #2B2D42;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            touch-action: none;
        }

        /* 警戒线自适应比例 */
        #danger-line {
            position: absolute;
            left: 0;
            top: 15%;
            width: 100%;
            height: 2px;
            border-top: 2px dashed #E63946;
            box-shadow: 0 0 8px #E63946;
            pointer-events: none;
            z-index: 5;
        }
        #danger-label {
            position: absolute;
            right: 8px;
            top: -18px;
            font-size: 10px;
            color: #E63946;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 顶部下落预览指示器 */
        #dropper-preview {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 8;
            background-size: cover;
            background-position: center;
            border: 2px solid #D4AF37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        /* Combo 连击漂浮字 */
        .combo-text {
            position: absolute;
            font-weight: 900;
            color: #FFD166;
            text-shadow: 0 0 10px #E63946, 2px 2px 0 #000;
            pointer-events: none;
            z-index: 25;
            animation: comboFly 0.85s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes comboFly {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
            70% { opacity: 1; transform: translate(-50%, -100%) scale(1.0); }
            100% { opacity: 0; transform: translate(-50%, -130%) scale(0.8); }
        }

        /* 屏幕微震动反馈 */
        .shake {
            animation: screenShake 0.15s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes screenShake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        /* 结算弹层 */
        #game-over-mask {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.94);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 16px;
        }

        #capture-area {
            width: 90%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            background: #16181E;
            border: 3px solid #D4AF37;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }

        .poster-badge {
            font-size: 12px;
            color: #E63946;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .poster-title {
            font-size: 21px;
            font-weight: 900;
            color: #D4AF37;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .poster-score-box {
            background: #0D0E12;
            border: 1px solid #333745;
            padding: 6px 20px;
            border-radius: 8px;
            margin: 6px 0;
            text-align: center;
        }
        .poster-score-num {
            font-size: 34px;
            color: #FFD166;
            font-weight: bold;
            font-family: 'Arial Black', sans-serif;
        }

        .poster-role-tag {
            font-size: 13px;
            color: #E5E9F0;
            margin-top: 6px;
            padding: 3px 12px;
            background: rgba(230, 57, 70, 0.25);
            border-radius: 15px;
            border: 1px solid #E63946;
        }

        .poster-footer {
            margin-top: 10px;
            font-size: 10px;
            color: #6C757D;
            letter-spacing: 1px;
        }

        .mobile-poster-box {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 12px;
            width: 100%;
        }
        #final-poster-img {
            width: 80%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            border: 3px solid #D4AF37;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .save-tip {
            font-size: 12px;
            color: #FFD166;
            font-weight: bold;
            margin-top: 8px;
            background: #252834;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid #3D4254;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
            width: 80%;
            max-width: 300px;
        }

        .btn-core {
            border: none;
            padding: 11px 0;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-gold {
            background: linear-gradient(90deg, #D4AF37 0%, #AA820A 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-dark {
            background: #2B2D42;
            color: #E5E9F0;
            border: 1px solid #4A4E69;
        }
        .btn-core:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="title-group">
        <h1>合成大苗哥·雷霆版</h1>
        <div class="subtitle">慎点!!! 苗哥真爱战力挑战</div>
    </div>
    <div class="score-board">
        <div class="score-label">总战力分</div>
        <div class="score-val" id="score">0</div>
    </div>
</div>

<div id="game-wrapper">
    <div id="danger-line"><span id="danger-label">极限真爱警戒线 ⚠️</span></div>
    <div id="dropper-preview"></div>

    <div id="game-over-mask">
        <div id="capture-area">
            <div class="poster-badge">⚡ 终局战报 · 战损认证 ⚡</div>
            <div class="poster-title">合成大苗哥·雷霆版</div>
            <div class="poster-score-box">
                <div style="font-size: 11px; color:#8D99AE;">最终武力值</div>
                <div class="poster-score-num" id="final-score">0</div>
            </div>
            <div class="poster-role-tag" id="max-role-tag">最高形态：-</div>
            <div class="poster-footer">© 演员谢苗超话 · 雷霆出击认证</div>
        </div>

        <div class="mobile-poster-box" id="mobile-poster-box">
            <img id="final-poster-img" src="" alt="专属战绩卡">
            <div class="save-tip">👆 长按上方图片即可保存到手机相册 👆</div>
        </div>

        <div class="btn-group">
            <button class="btn-core btn-gold" id="gen-poster-btn" onclick="generatePoster()">📸 生成 1:1 专属战报</button>
            <button class="btn-core btn-dark" onclick="location.reload()">重燃战火 🔁</button>
        </div>
    </div>
</div>

<script>
    // 音效系统
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playWhooshSound() {
        initAudio();
        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(320, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.12);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function playHeavyPunchSound(level = 6) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        const startFreq = 180 + (level * 10);
        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    function playSwordSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2400, audioCtx.currentTime + 0.08);
        osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    }

    function playGrandTriumphSound() {
        initAudio();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.08);
            osc.stop(audioCtx.currentTime + idx * 0.08 + 0.4);
        });
    }

    function playSoundByLevel(level) {
        if (level === 10) playSwordSound();
        else if (level === 12) playGrandTriumphSound();
        else if (level >= 6) playHeavyPunchSound(level);
        else playWhooshSound();
    }

    // 连击飘字
    let comboCount = 0;
    let lastMergeTime = 0;
    const COMBO_WORDS = [
        "我佛糍粑",
        "苗哥我错了",
        "功夫小子",
        "这谁能顶住",
        "给大佬递锤子",
        "目中有人了！",
        "火遮眼了！"
    ];

    function triggerComboPopup(x, y) {
        const now = Date.now();
        if (now - lastMergeTime < 950) {
            comboCount++;
        } else {
            comboCount = 1;
        }
        lastMergeTime = now;

        if (comboCount >= 2) {
            const word = COMBO_WORDS[Math.floor(Math.random() * COMBO_WORDS.length)];
            const span = document.createElement('div');
            span.className = 'combo-text';
            span.innerText = `${word} Combo x${comboCount}!`;
            span.style.left = `${x}px`;
            span.style.top = `${y}px`;
            span.style.fontSize = `${Math.min(24, 15 + comboCount * 2)}px`;
            wrapper.appendChild(span);
            setTimeout(() => span.remove(), 850);
        }
    }

    const wrapper = document.getElementById('game-wrapper');
    const previewEl = document.getElementById('dropper-preview');
    const scoreEl = document.getElementById('score');
    const gameOverMask = document.getElementById('game-over-mask');
    const finalScoreEl = document.getElementById('final-score');
    const maxRoleTag = document.getElementById('max-role-tag');

    // 动态获取手机容器尺寸
    let width = wrapper.clientWidth || window.innerWidth;
    let height = wrapper.clientHeight || (window.innerHeight - 60);

    // 根据手机实际屏幕宽度动态缩放小球半径，防止球体溢出或过大
    const scaleFactor = Math.min(1.05, Math.max(0.78, width / 390));

    const RAW_ROLES = [
        { level: 0,  name: "成瞎子", baseR: 16 },
        { level: 1,  name: "少林小子",   baseR: 21 },
        { level: 2,  name: "小飞侠", baseR: 27 },
        { level: 3,  name: "宰相小甘罗",   baseR: 33 },
        { level: 4,  name: "体育老师", baseR: 40 },
        { level: 5,  name: "齐天大圣",   baseR: 48 },
        { level: 6,  name: "东百阿sir", baseR: 56 },
        { level: 7,  name: "网大一哥",   baseR: 64 },
        { level: 8,  name: "好辣好辣",   baseR: 73 },
        { level: 9,  name: "荧幕巨星", baseR: 83 },
        { level: 10, name: "英雄母亲", baseR: 94 },
        { level: 11, name: "华夏第一美胸",   baseR: 106 },
        { level: 12, name: "苗哥本尊", baseR: 120 }
    ];

    const ROLES = RAW_ROLES.map(item => ({
        level: item.level,
        name: item.name,
        radius: Math.round(item.baseR * scaleFactor)
    }));

    // 图片自动兼容
    const roleImages = [];
    function initImageAssets() {
        ROLES.forEach((role, index) => {
            const num = index + 1;
            const img = new Image();
            const candidatePaths = [
                `./images/role(${num}).png`,
                `./images/role(${num}).jpg`,
                `./images/role（${num}）.png`,
                `./images/role（${num}）.jpg`,
                `./images/role${num}.png`,
                `./images/role${num}.jpg`
            ];
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < candidatePaths.length) {
                    img.src = encodeURI(candidatePaths[attempt]);
                }
            };
            img.src = encodeURI(candidatePaths[0]);
            roleImages.push(img);
        });
    }
    initImageAssets();

    let score = 0;
    let highestLevel = 0;
    let isGameOver = false;
    let canDrop = true;
    let currentDropLevel = 0;
    let currentX = width / 2;

    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    const engine = Engine.create({ enableSleeping: false });
    engine.gravity.y = 1.35;

    const render = Render.create({
        element: wrapper,
        engine: engine,
        options: {
            width: width,
            height: height,
            wireframes: false,
            background: 'transparent'
        }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    // 严丝合缝贴合手机屏幕边界的刚体墙
    const wallThick = 60;
    const ground = Bodies.rectangle(width / 2, height + wallThick / 2, width * 2, wallThick, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    const leftWall = Bodies.rectangle(-wallThick / 2, height / 2, wallThick, height * 2, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    const rightWall = Bodies.rectangle(width + wallThick / 2, height / 2, wallThick, height * 2, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    // 绘制头像与电金外环
    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(body => {
            if (body.roleInfo) {
                const { x, y } = body.position;
                const r = body.roleInfo.radius;
                const img = roleImages[body.roleInfo.level];

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(body.angle);

                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.clip();

                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, -r, -r, r * 2, r * 2);
                } else {
                    ctx.fillStyle = "#1E2028";
                    ctx.fill();
                    ctx.fillStyle = "#D4AF37";
                    ctx.font = `bold ${Math.max(10, r * 0.35)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(body.roleInfo.name, 0, 0);
                }

                ctx.restore();
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.lineWidth = body.roleInfo.level >= 10 ? 3 : 2;
                ctx.strokeStyle = body.roleInfo.level >= 10 ? '#FFD166' : '#D4AF37';
                ctx.stroke();
                ctx.restore();
            }
        });
    });

    function setupNextDrop() {
        let maxDropLevel = 3;
        if (score > 600) maxDropLevel = 4;
        if (score > 1500) maxDropLevel = 5;

        currentDropLevel = Math.floor(Math.random() * maxDropLevel);
        const info = ROLES[currentDropLevel];
        const r = info.radius;

        previewEl.style.width = (r * 2) + 'px';
        previewEl.style.height = (r * 2) + 'px';

        const img = roleImages[currentDropLevel];
        if (img && img.src) {
            previewEl.style.backgroundImage = `url('${img.src}')`;
            previewEl.innerText = "";
        } else {
            previewEl.style.backgroundColor = "#2B2D42";
            previewEl.innerText = info.name;
        }

        updatePreviewPos(currentX);
    }

    function updatePreviewPos(x) {
        const r = ROLES[currentDropLevel].radius;
        const clampedX = Math.max(r + 2, Math.min(width - r - 2, x));
        currentX = clampedX;
        previewEl.style.left = clampedX + 'px';
    }

    function dropRole() {
        if (!canDrop || isGameOver) return;
        canDrop = false;

        const info = ROLES[currentDropLevel];
        const circle = Bodies.circle(currentX, height * 0.05, info.radius, {
            restitution: 0.15,
            friction: 0.15,
            density: 0.003,
            render: { visible: false }
        });
        circle.roleInfo = info;
        Composite.add(engine.world, circle);

        playWhooshSound();
        previewEl.style.display = 'none';

        setTimeout(() => {
            if (!isGameOver) {
                setupNextDrop();
                previewEl.style.display = 'block';
                canDrop = true;
            }
        }, 500);
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const bodyA = pair.bodyA;
            const bodyB = pair.bodyB;

            if (bodyA.roleInfo && bodyB.roleInfo) {
                if (bodyA.roleInfo.level === bodyB.roleInfo.level) {
                    const nextLevel = bodyA.roleInfo.level + 1;
                    if (nextLevel < ROLES.length && !bodyA.isRemoved && !bodyB.isRemoved) {
                        bodyA.isRemoved = true;
                        bodyB.isRemoved = true;

                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;
                        const nextInfo = ROLES[nextLevel];

                        Composite.remove(engine.world, [bodyA, bodyB]);

                        const newCircle = Bodies.circle(midX, midY, nextInfo.radius, {
                            restitution: 0.15,
                            friction: 0.15,
                            density: 0.003,
                            render: { visible: false }
                        });
                        newCircle.roleInfo = nextInfo;
                        Composite.add(engine.world, newCircle);

                        if (nextLevel >= 7) {
                            wrapper.classList.add('shake');
                            setTimeout(() => wrapper.classList.remove('shake'), 160);
                        }

                        if (nextLevel > highestLevel) highestLevel = nextLevel;

                        score += (nextLevel + 1) * 3;
                        scoreEl.innerText = score;

                        playSoundByLevel(nextLevel);
                        triggerComboPopup(midX, midY);
                    }
                }
            }
        });
    });

    // 警戒线按比例检测
    const DANGER_Y = height * 0.15;
    setInterval(() => {
        if (isGameOver) return;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(b => {
            if (b.roleInfo && (b.position.y - b.roleInfo.radius < DANGER_Y)) {
                if (Math.abs(b.velocity.y) < 0.2 && Math.abs(b.velocity.x) < 0.2 && b.position.y > (height * 0.08)) {
                    triggerGameOver();
                }
            }
        });
    }, 1000);

    function triggerGameOver() {
        isGameOver = true;
        previewEl.style.display = 'none';
        finalScoreEl.innerText = score;
        maxRoleTag.innerText = `最高形态：${ROLES[highestLevel].name}`;
        gameOverMask.style.display = 'flex';
    }

    function generatePoster() {
        const captureArea = document.getElementById('capture-area');
        const mobilePosterBox = document.getElementById('mobile-poster-box');
        const finalPosterImg = document.getElementById('final-poster-img');
        const genBtn = document.getElementById('gen-poster-btn');

        html2canvas(captureArea, {
            scale: 2,
            backgroundColor: "#16181E",
            useCORS: true
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            finalPosterImg.src = imgData;

            captureArea.style.display = 'none';
            genBtn.style.display = 'none';
            mobilePosterBox.style.display = 'flex';
        });
    }

    // 移动端精准触控
    function handleTouchMove(e) {
        const rect = wrapper.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updatePreviewPos(clientX - rect.left);
    }

    wrapper.addEventListener('touchstart', (e) => {
        handleTouchMove(e);
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
        if (!canDrop) return;
        handleTouchMove(e);
    }, { passive: true });

    wrapper.addEventListener('touchend', () => {
        dropRole();
    });

    // 电脑端鼠标兼容
    wrapper.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse') {
            const rect = wrapper.getBoundingClientRect();
            updatePreviewPos(e.clientX - rect.left);
        }
    });

    wrapper.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' && canDrop) {
            const rect = wrapper.getBoundingClientRect();
            updatePreviewPos(e.clientX - rect.left);
        }
    });

    wrapper.addEventListener('pointerup', (e) => {
        if (e.pointerType === 'mouse') dropRole();
    });

    setupNextDrop();
</script>

</body>
</html>
