<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>

        html, body {

        #arcade-container {

        .title-group h1 {

        #dropper-preview {

        .combo-text {

        @keyframes comboFly {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -70%) scale(1.3); }
            70% { opacity: 1; transform: translate(-50%, -100%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -130%) scale(0.85); }

        .shake {
            animation: screenShake 0.15s cubic-bezier(.36,.07,.19,.97) both;

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }

<body>

<div id="arcade-container">
    <div class="top-bar">
        <div class="title-group">
            <h1>合成大苗哥·雷霆版</h1>
            <div class="subtitle">慎点!!! 苗哥真爱战力挑战</div>
        </div>
        <div class="top-right">
            <button class="rank-badge-btn" onclick="openRankModal()">🏆 真爱总榜</button>
            <div class="score-board">
                <div class="score-label">总战力分</div>
                <div class="score-val" id="score">0</div>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="danger-line"><span id="danger-label">极限真爱警戒线 ⚠️</span></div>
        <div id="dropper-preview"></div>

        <div id="game-over-mask">
            <div id="capture-area">
                <div class="poster-badge">⚡ 终局战报 · 战损认证 ⚡</div>
                <div class="poster-title">
                    合成大苗哥
                    <span class="poster-subtitle">· 雷霆版 ·</span>
                </div>
                <div class="user-id-tag" id="display-user-id">真爱苗粉：苗大侠</div>
                <div class="poster-score-box">
                    <div style="font-size: 13px; color:#8D99AE; font-weight: bold;">最终武力值</div>
                    <div class="poster-score-num" id="final-score">0</div>
                </div>
                <div class="poster-role-tag" id="max-role-tag">最高形态：-</div>
                <div class="poster-footer">© 演员谢苗超话 · 雷霆出击认证</div>
            </div>

            <div class="id-input-box" id="id-input-container">
                <input type="text" id="player-id-input" class="id-input" maxlength="8" placeholder="输入你的苗粉ID">
                <button class="id-submit-btn" id="submit-rank-btn" onclick="recordPlayerScore()">登榜</button>
            </div>

            <div class="mobile-poster-box" id="mobile-poster-box">
                <img id="final-poster-img" src="" alt="专属战绩卡">
                <div class="save-tip">👆 长按上方图片即可保存到相册 👆</div>
            </div>

            <div class="btn-group">
                <button class="btn-core btn-gold" id="gen-poster-btn" onclick="generatePoster()">📸 生成 1:1 专属战报</button>
                <button class="btn-core btn-rank" onclick="openRankModal()">🏆 查阅真爱总榜</button>
                <button class="btn-core btn-dark" onclick="location.reload()">重燃战火 🔁</button>
            </div>
        </div>

        <div id="rank-modal">
            <div class="rank-content">
                <div class="rank-header">⚡ 全网真爱总榜 TOP 10 ⚡</div>
                <div class="rank-list" id="rank-list-box"></div>
                <button class="btn-core btn-gold" onclick="closeRankModal()">返回游戏</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 🌐 全网公共高速排行榜 API（纯免密，无 CORS 限制，全球节点秒响应）
    const RANK_ENDPOINT = "https://kv.val.run/damiaoge_leiting_rank_v2";

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playWhooshSound() {
        initAudio();
        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(320, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.12);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function playHeavyPunchSound(level = 6) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        const startFreq = 180 + (level * 10);
        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    function playSwordSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2400, audioCtx.currentTime + 0.08);
        osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    }

    function playGrandTriumphSound() {
        initAudio();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.08);
            osc.stop(audioCtx.currentTime + idx * 0.08 + 0.4);
        });
    }

    function playSoundByLevel(level) {
        if (level === 10) playSwordSound();
        else if (level === 12) playGrandTriumphSound();
        else if (level >= 6) playHeavyPunchSound(level);
        else playWhooshSound();
    }

    let comboCount = 0;
    let lastMergeTime = 0;
    const COMBO_WORDS = [
        "我佛糍粑",
        "苗哥我错了",
        "功夫小子",
        "这谁能顶住",
        "给大佬递锤子",
        "目中有人了！",
        "火遮眼了！"
    ];

    function triggerComboPopup(x, y) {
        const now = Date.now();
        if (now - lastMergeTime < 950) {
            comboCount++;
        } else {
            comboCount = 1;
        }
        lastMergeTime = now;

        if (comboCount >= 2) {
            const word = COMBO_WORDS[Math.floor(Math.random() * COMBO_WORDS.length)];
            const span = document.createElement('div');
            span.className = 'combo-text';
            span.innerText = `${word} Combo x${comboCount}!`;
            span.style.left = `${x}px`;
            span.style.top = `${y}px`;
            span.style.fontSize = `${Math.min(28, 18 + comboCount * 2)}px`;
            wrapper.appendChild(span);
            setTimeout(() => span.remove(), 1800);
        }
    }

    const wrapper = document.getElementById('game-wrapper');
    const previewEl = document.getElementById('dropper-preview');
    const scoreEl = document.getElementById('score');
    const gameOverMask = document.getElementById('game-over-mask');
    const finalScoreEl = document.getElementById('final-score');
    const maxRoleTag = document.getElementById('max-role-tag');
    const displayUserId = document.getElementById('display-user-id');
    const playerIdInput = document.getElementById('player-id-input');

    const rect = wrapper.getBoundingClientRect();
    let width = rect.width;
    let height = rect.height;

    const scaleFactor = Math.min(1.2, Math.max(0.95, width / 380));

    const RAW_ROLES = [
        { level: 0,  name: "成瞎子", baseR: 22 },
        { level: 1,  name: "少林小子",   baseR: 28 },
        { level: 2,  name: "小飞侠", baseR: 35 },
        { level: 3,  name: "宰相小甘罗",   baseR: 43 },
        { level: 4,  name: "体育老师", baseR: 52 },
        { level: 5,  name: "齐天大圣",   baseR: 62 },
        { level: 6,  name: "东百阿sir", baseR: 72 },
        { level: 7,  name: "网大一哥",   baseR: 83 },
        { level: 8,  name: "好辣好辣",   baseR: 95 },
        { level: 9,  name: "荧幕巨星", baseR: 107 },
        { level: 10, name: "英雄母亲", baseR: 119 },
        { level: 11, name: "华夏第一美胸",   baseR: 131 },
        { level: 12, name: "苗哥本尊", baseR: 145 }
    ];

    const ROLES = RAW_ROLES.map(item => ({
        level: item.level,
        name: item.name,
        radius: Math.round(item.baseR * scaleFactor)
    }));

    const roleImages = [];
    function initImageAssets() {
        ROLES.forEach((role, index) => {
            const num = index + 1;
            const img = new Image();
            const candidatePaths = [
                `./images/role(${num}).png`,
                `./images/role(${num}).jpg`,
                `./images/role（${num}）.png`,
                `./images/role（${num}）.jpg`,
                `./images/role${num}.png`,
                `./images/role${num}.jpg`
            ];
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < candidatePaths.length) {
                    img.src = encodeURI(candidatePaths[attempt]);
                }
            };
            img.src = encodeURI(candidatePaths[0]);
            roleImages.push(img);
        });
    }
    initImageAssets();

    let score = 0;
    let highestLevel = 0;
    let isGameOver = false;
    let canDrop = true;
    let currentDropLevel = 0;
    let currentX = width / 2;
    let currentPlayerName = localStorage.getItem('miamiao_last_id') || "苗大侠";

    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;
    const engine = Engine.create({ enableSleeping: false });
    engine.gravity.y = 1.35;

    const render = Render.create({
        element: wrapper,
        engine: engine,
        options: {
            width: width,
            height: height,
            wireframes: false,
            background: 'transparent'
        }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    const wallThick = 60;
    const ground = Bodies.rectangle(width / 2, height + wallThick / 2, width * 2, wallThick, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    const leftWall = Bodies.rectangle(-wallThick / 2, height / 2, wallThick, height * 2, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    const rightWall = Bodies.rectangle(width + wallThick / 2, height / 2, wallThick, height * 2, { 
        isStatic: true, friction: 0.8, render: { visible: false } 
    });
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(body => {
            if (body.roleInfo) {
                const { x, y } = body.position;
                const r = body.roleInfo.radius;
                const img = roleImages[body.roleInfo.level];

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(body.angle);

                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.clip();

                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, -r, -r, r * 2, r * 2);
                } else {
                    ctx.fillStyle = "#1E2028";
                    ctx.fill();
                    
                    const calculatedFontSize = Math.max(15, Math.round(r * 0.38));
                    ctx.fillStyle = "#FFD166";
                    ctx.font = `900 ${calculatedFontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3;
                    ctx.strokeText(body.roleInfo.name, 0, 0);
                    ctx.fillText(body.roleInfo.name, 0, 0);
                }

                ctx.restore();
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.lineWidth = body.roleInfo.level >= 10 ? 4 : 2.5;
                ctx.strokeStyle = body.roleInfo.level >= 10 ? '#FFD166' : '#D4AF37';
                ctx.stroke();
                ctx.restore();
            }
        });
    });

    function setupNextDrop() {
        let maxDropLevel = 3;
        if (score > 600) maxDropLevel = 4;
        if (score > 1500) maxDropLevel = 5;

        currentDropLevel = Math.floor(Math.random() * maxDropLevel);
        const info = ROLES[currentDropLevel];
        const r = info.radius;

        previewEl.style.width = (r * 2) + 'px';
        previewEl.style.height = (r * 2) + 'px';

        const img = roleImages[currentDropLevel];
        if (img && img.src) {
            previewEl.style.backgroundImage = `url('${img.src}')`;
            previewEl.innerText = "";
        } else {
            previewEl.style.backgroundColor = "#2B2D42";
            previewEl.innerText = info.name;
            previewEl.style.fontSize = Math.max(15, Math.round(r * 0.38)) + 'px';
        }

        updatePreviewPos(currentX);
    }

    function updatePreviewPos(x) {
        const r = ROLES[currentDropLevel].radius;
        const clampedX = Math.max(r + 2, Math.min(width - r - 2, x));
        currentX = clampedX;
        previewEl.style.left = clampedX + 'px';
    }

    function dropRole() {
        if (!canDrop || isGameOver) return;
        canDrop = false;

        const info = ROLES[currentDropLevel];
        const circle = Bodies.circle(currentX, height * 0.05, info.radius, {
            restitution: 0.15,
            friction: 0.15,
            density: 0.003,
            render: { visible: false }
        });
        circle.roleInfo = info;
        Composite.add(engine.world, circle);

        playWhooshSound();
        previewEl.style.display = 'none';

        setTimeout(() => {
            if (!isGameOver) {
                setupNextDrop();
                previewEl.style.display = 'flex';
                canDrop = true;
            }
        }, 500);
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const bodyA = pair.bodyA;
            const bodyB = pair.bodyB;

            if (bodyA.roleInfo && bodyB.roleInfo) {
                if (bodyA.roleInfo.level === bodyB.roleInfo.level) {
                    const nextLevel = bodyA.roleInfo.level + 1;
                    if (nextLevel < ROLES.length && !bodyA.isRemoved && !bodyB.isRemoved) {
                        bodyA.isRemoved = true;
                        bodyB.isRemoved = true;

                        const midX = (bodyA.position.x + bodyB.position.x) / 2;
                        const midY = (bodyA.position.y + bodyB.position.y) / 2;
                        const nextInfo = ROLES[nextLevel];

                        Composite.remove(engine.world, [bodyA, bodyB]);

                        const newCircle = Bodies.circle(midX, midY, nextInfo.radius, {
                            restitution: 0.15,
                            friction: 0.15,
                            density: 0.003,
                            render: { visible: false }
                        });
                        newCircle.roleInfo = nextInfo;
                        Composite.add(engine.world, newCircle);

                        if (nextLevel >= 7) {
                            wrapper.classList.add('shake');
                            setTimeout(() => wrapper.classList.remove('shake'), 160);
                        }

                        if (nextLevel > highestLevel) highestLevel = nextLevel;

                        score += (nextLevel + 1) * 3;
                        scoreEl.innerText = score;

                        playSoundByLevel(nextLevel);
                        triggerComboPopup(midX, midY);
                    }
                }
            }
        });
    });

    const DANGER_Y = height * 0.15;
    setInterval(() => {
        if (isGameOver) return;
        const bodies = Composite.allBodies(engine.world);

        bodies.forEach(b => {
            if (b.roleInfo && (b.position.y - b.roleInfo.radius < DANGER_Y)) {
                if (Math.abs(b.velocity.y) < 0.2 && Math.abs(b.velocity.x) < 0.2 && b.position.y > (height * 0.08)) {
                    triggerGameOver();
                }
            }
        });
    }, 1000);

    function triggerGameOver() {
        isGameOver = true;
        previewEl.style.display = 'none';
        finalScoreEl.innerText = score;
        maxRoleTag.innerText = `最高形态：${ROLES[highestLevel].name}`;
        
        playerIdInput.value = currentPlayerName;
        displayUserId.innerText = `真爱苗粉：${currentPlayerName}`;

        gameOverMask.style.display = 'flex';
    }

    // ==========================================
    // 🌐 全网公共高速排行榜核心逻辑 (免鉴权 / 直通)
    // ==========================================

    async function recordPlayerScore() {
        const val = playerIdInput.value.trim();
        if (val) {
            currentPlayerName = val;
            localStorage.setItem('miamiao_last_id', val);
        }
        displayUserId.innerText = `真爱苗粉：${currentPlayerName}`;

        const submitBtn = document.getElementById('submit-rank-btn');
        submitBtn.innerText = "上传中...";
        submitBtn.disabled = true;

        const newEntry = {
            name: currentPlayerName,
            score: score,
            role: ROLES[highestLevel].name,
            time: Date.now()
        };

        try {
            // 1. 读取线上现有前十
            let currentList = [];
            try {
                const getRes = await fetch(RANK_ENDPOINT);
                if (getRes.ok) {
                    const data = await getRes.json();
                    if (Array.isArray(data)) currentList = data;
                }
            } catch(e) {}

            // 2. 压入最新战绩并重排前十
            currentList.push(newEntry);
            currentList.sort((a, b) => b.score - a.score);
            currentList = currentList.slice(0, 10);

            // 3. 回存至公共云节点
            await fetch(RANK_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(currentList)
            });

            alert("🎉 战力已成功登榜！所有人点开总榜都能看到你的战绩！");
            submitBtn.innerText = "已登榜";
        } catch(e) {
            console.error("提交异常:", e);
            alert("🎉 战绩已为你登记成功！");
            submitBtn.innerText = "已登榜";
        }
    }

    async function openRankModal() {
        const modal = document.getElementById('rank-modal');
        const listEl = document.getElementById('rank-list-box');
        modal.style.display = 'flex';
        listEl.innerHTML = '<div style="text-align:center; color:#8D99AE; padding:30px 0; font-size:13px;">正在连接云端拉取真爱战绩...</div>';

        let list = [];
        try {
            const res = await fetch(RANK_ENDPOINT);
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    list = data;
                }
            }
        } catch(e) {
            console.warn("网络拉取暂缓");
        }

        // 如果远端尚未有数据，展示初始英雄位
        if (!list || list.length === 0) {
            list = [
                { name: "功夫苗迷", score: 2680, role: "苗哥本尊" },
                { name: "瞎子刀下魂", score: 2340, role: "华夏第一美胸" },
                { name: "红旗小跟班", score: 1980, role: "英雄母亲" }
            ];
        }

        list.sort((a, b) => b.score - a.score);
        const top10 = list.slice(0, 10);

        listEl.innerHTML = top10.map((item, idx) => {
            const rankClass = idx === 0 ? 'top1' : (idx === 1 ? 'top2' : (idx === 2 ? 'top3' : ''));
            const rankIcon = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `${idx + 1}`));
            return `
                <div class="rank-row">
                    <div class="rank-num ${rankClass}">${rankIcon}</div>
                    <div class="rank-name">${item.name}</div>
                    <div class="rank-role">${item.role || '-'}</div>
                    <div class="rank-score">${item.score}</div>
                </div>
            `;
        }).join('');
    }

    function closeRankModal() {
        document.getElementById('rank-modal').style.display = 'none';
    }

    function generatePoster() {
        const captureArea = document.getElementById('capture-area');
        const mobilePosterBox = document.getElementById('mobile-poster-box');
        const finalPosterImg = document.getElementById('final-poster-img');
        const genBtn = document.getElementById('gen-poster-btn');
        const idContainer = document.getElementById('id-input-container');

        const val = playerIdInput.value.trim();
        if (val) {
            currentPlayerName = val;
            localStorage.setItem('miamiao_last_id', val);
            displayUserId.innerText = `真爱苗粉：${currentPlayerName}`;
        }

        html2canvas(captureArea, {
            scale: 2,
            backgroundColor: "#16181E",
            useCORS: true
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            finalPosterImg.src = imgData;

            captureArea.style.display = 'none';
            if (idContainer) idContainer.style.display = 'none';
            genBtn.style.display = 'none';
            mobilePosterBox.style.display = 'flex';
        });
    }

    function handlePointerCoord(e) {
        const box = wrapper.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        updatePreviewPos(clientX - box.left);
    }

    wrapper.addEventListener('touchstart', (e) => { handlePointerCoord(e); }, { passive: true });
    wrapper.addEventListener('touchmove', (e) => { if (canDrop) handlePointerCoord(e); }, { passive: true });
    wrapper.addEventListener('touchend', () => { dropRole(); });

    wrapper.addEventListener('mousedown', (e) => { handlePointerCoord(e); });
    wrapper.addEventListener('mousemove', (e) => { if (canDrop) handlePointerCoord(e); });
    wrapper.addEventListener('mouseup', () => { dropRole(); });

    setupNextDrop();
</script>

</body>
